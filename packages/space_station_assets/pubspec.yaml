name: space_station_assets
# Released as a git tag (ADR-0003 D1: `space_station_assets-v<version>`);
# a downstream station pins `git: {url, ref, path}`.
version: 0.1.0
description: >-
  The reusable core of memento's grid station — SpaceDelegate (the station
  authored as a Seed), the resident verbs (up/down/status), and the composed
  vended Commands (assets/search) — over the the_grid CLI-SDK and the
  power_station asset packs. The thin runner (apps/space) drives it; a
  downstream station (an IC's private station) imports and extends it instead
  of forking.
publish_to: none
repository: https://github.com/memento-engineering/space_station
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  beads_dart:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      ref: beads_dart-v0.1.0
      path: packages/beads_dart
  dart_grid_assets:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/power_station.git
      ref: dart_grid_assets-v0.1.0
      path: packages/dart_grid_assets
  federated_grid_assets:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/power_station.git
      ref: federated_grid_assets-v0.1.0
      path: packages/federated_grid_assets
  genesis_tree: ^0.1.3
  grid_assets:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/power_station.git
      ref: grid_assets-v0.1.0
      path: packages/grid_assets
  grid_cli:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      ref: grid_cli-v0.1.0
      path: packages/grid_cli
  # The dev-mode host: `GridExplorationHost` (the sole registrar of
  # `ext.exploration.*`) + the optional `ReassembleTool` a JIT station composes
  # so `space reload` has an extension to invoke.
  grid_exploration:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      ref: grid_exploration-v0.1.0
      path: packages/grid_exploration
  grid_runtime:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      ref: grid_runtime-v0.1.0
      path: packages/grid_runtime
  # The public authoring surface of the grid (ADR-0008 D2): `GridDelegate` +
  # the composition Seeds space authors its station as (`SpaceDelegate`, the v3
  # code-as-config model — `the_grid/docs/SCRATCH-station-config-model.md`).
  grid_sdk:
    # Release pin (power_station ADR-0003 D1, space-td1): a producer
    # change is adopted DELIBERATELY by bumping the ref — space always
    # compiles from its own source regardless of upstream main. Dev
    # co-editing rides the gitignored pubspec_overrides.yaml (D5).
    git:
      url: git@github.com:memento-engineering/the_grid.git
      ref: grid_sdk-v0.1.0
      path: packages/grid_sdk
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
