name: space_station_assets
# ADR-0003 D1 source amendment: published dependencies resolve from hosted
# constraints because hosted sibling dependencies cannot mix with git sources.
version: 0.1.0
description: >-
  The reusable core of memento's grid station — SpaceDelegate (the station
  authored as a Seed), the resident verbs (up/down/status), and the composed
  vended Commands (assets/search) — over the the_grid CLI-SDK and the
  power_station asset packs. The thin runner (apps/space) drives it; a
  downstream station (an IC's private station) imports and extends it instead
  of forking.
publish_to: none
repository: https://github.com/memento-engineering/space_station
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  beads_dart: ^0.2.0-rc.2
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  dart_grid_assets: ^0.1.0
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  federated_grid_assets: ^0.3.0-rc.1
  genesis_tree: ^0.2.0
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  grid_assets: ^0.5.0-rc.1
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  grid_cli: ^0.5.0-rc.3
  # The engine's SDK-facing value types the composed seat stack provides into
  # the tree (`ServiceBundle` — space-47t's watch-based seat assets author it
  # directly now that the seat stack lives here).
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint.
  grid_engine: ^0.3.0-rc.2
  # The dev-mode host: `GridExplorationHost` (the sole registrar of
  # `ext.exploration.*`) + the optional `ReassembleTool` a JIT station composes
  # so `space reload` has an extension to invoke.
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  grid_exploration: ^0.3.0-rc.1
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  grid_runtime: ^0.2.0-rc.2
  # The public authoring surface of the grid (ADR-0008 D2): `GridDelegate` +
  # the composition Seeds space authors its station as (`SpaceDelegate`, the v3
  # code-as-config model — `the_grid/docs/SCRATCH-station-config-model.md`).
  # Hosted release constraint (ADR-0003 D1 source amendment): a producer
  # change is adopted DELIBERATELY by bumping this constraint. Hosted source
  # is required because published siblings depend on each other from hosted;
  # local co-editing still rides gitignored pubspec_overrides.yaml (D5).
  grid_sdk: ^0.3.0-rc.2
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
