name: Publish to pub.dev

# Per-package release tags use `<package>-v<version>`. Pushing, for example,
# `space_station_assets-v0.3.0-rc.8` publishes the matching package through
# pub.dev's GitHub Actions trusted publishing. Enable automated publishing once
# for repository memento-engineering/space_station with tag pattern
# `space_station_assets-v{{version}}`.
#
# Push one tag per `git push` so each release has one ordered publish run.

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+'
      - '*-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
    steps:
      - id: parse
        run: |
          pkg="${GITHUB_REF_NAME%-v*}"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "Publishing package: $pkg (tag $GITHUB_REF_NAME)"

  publish:
    needs: parse
    permissions:
      id-token: write # pub.dev OIDC trusted publishing
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/${{ needs.parse.outputs.package }}
