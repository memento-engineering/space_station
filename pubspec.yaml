name: space_station_workspace
description: >-
  memento's grid station — a pub workspace: the thin JIT runner (apps/space)
  over the reusable station composition (packages/space_station_assets), which
  downstream stations (e.g. a private IC station) import and extend instead of
  forking.
publish_to: none
repository: https://github.com/memento-engineering/space_station

environment:
  sdk: ^3.11.0

workspace:
  - apps/space
  - packages/space_station_assets

dev_dependencies:
  melos: ^7.7.0

melos:
  scripts:
    test:
      description: >-
        Run each member's tests (dart test does not fan out from a workspace
        root).
      steps:
        - test:dart
    analyze:
      description: Run dart analyze on the entire workspace.
      run: dart analyze
    format:
      description: Check formatting for all Dart files.
      run: dart format --output=none --set-exit-if-changed .

    test:dart:
      private: true
      description: dart test in every member with a test/ dir.
      exec: dart test
      packageFilters:
        dirExists: test
