name: space_station
description: >-
  memento's grid station — the assembled runner + configuration over the
  the_grid CLI-SDK and the power_station asset packs (the Dart runner model:
  compose the Commands you want, `dart compile exe bin/space.dart -o space`).
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  beads_dart: any
  dart_grid_assets: any
  federated_grid_assets: any
  genesis_tree: ^0.1.3
  grid_assets: any
  grid_cli: any
  grid_engine: any
  # The dev-mode host: `GridExplorationHost` (the sole registrar of
  # `ext.exploration.*`) + the optional `ReassembleTool` a JIT station composes
  # so `space reload` has an extension to invoke.
  grid_exploration: any
  grid_runtime: any
  # The public authoring surface of the grid (ADR-0008 D2): `GridDelegate` +
  # the composition Seeds space authors its station as (`SpaceDelegate`, the v3
  # code-as-config model — `the_grid/docs/SCRATCH-station-config-model.md`).
  grid_sdk: any
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
