name: space
description: >-
  memento's grid station runner — the thin JIT app over
  space_station_assets (the reusable composition: SpaceDelegate + the
  station's Commands). Run it from the workspace root: `dart run space:space`.
publish_to: none
repository: https://github.com/memento-engineering/space_station
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  space_station_assets: ^0.5.0-dev.6

dev_dependencies:
  # The process-level smokes drive the REAL runner and assert over grid_cli's
  # lock/attach surfaces directly. Keep this constraint identical to
  # space_station_assets so the workspace resolves one hosted grid_cli release.
  grid_cli: ^0.6.0-dev.4
  lints: ^5.1.0
  path: ^1.9.0
  test: ^1.25.0
